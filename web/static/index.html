<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markush结构解析与药物分子专利评估智能体</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">M</span>
          <div>
            <h1>Markush结构解析与药物分子专利评估智能体</h1>
            <p>侵权分析 / 可授权分析 / 实时工作流</p>
          </div>
        </div>
        <div class="topbar-tags" aria-label="系统状态">
          <span>LLM-only</span>
          <span>Pipeline步骤输出</span>
        </div>
      </header>

      <main class="workbench">
        <aside class="side-rail">
          <section class="panel task-panel">
            <div class="panel-title">
              <p>Analysis</p>
              <h2>分析任务</h2>
            </div>

            <div class="analysis-toggle-row">
              <span class="analysis-pill">侵权分析</span>
              <button
                id="patentability-toggle"
                class="followup-toggle"
                type="button"
                aria-pressed="false"
                aria-controls="patentability-options"
              >
                可授权分析：关闭
              </button>
            </div>

            <form id="infringement-form" class="analysis-form">
              <label>
                <span>目标专利号</span>
                <input name="patent_id" value="WO2020252229A2" placeholder="WO2020252229A2" />
              </label>
              <label>
                <span>目标分子 SMILES</span>
                <textarea name="smiles" rows="3" placeholder="输入待评估药物分子 SMILES">CCc1cncc(NCc2cccnc2)n1</textarea>
              </label>
              <label>
                <span>Markush 描述 / Caption</span>
                <textarea name="caption" rows="4" placeholder="可选：直接提供 Markush 通式描述"></textarea>
              </label>

              <div id="patentability-options" class="followup-options is-hidden">
                <label>
                  <span>可授权分析技术领域</span>
                  <input name="patentability_domain" value="kinase inhibitors" placeholder="例如 kinase inhibitors" />
                </label>
                <label>
                  <span>可授权分析已知现有技术</span>
                  <input name="patentability_prior_arts" placeholder="US12345678, WO2024000001" />
                </label>
              </div>

              <button id="infringement-submit" class="primary-action" type="submit">启动侵权分析</button>
            </form>
          </section>

          <section class="panel llm-panel">
            <div class="panel-title">
              <p>Session LLM</p>
              <h2>模型配置</h2>
            </div>
            <div class="field-grid">
              <label>
                <span>Provider</span>
                <select id="llm-provider">
                  <option value="openai">OpenAI Compatible</option>
                  <option value="anthropic">Anthropic</option>
                  <option value="google">Google</option>
                </select>
              </label>
              <label>
                <span>模型</span>
                <input id="llm-model" list="model-options" value="qwen-max" placeholder="qwen-max" />
                <datalist id="model-options">
                  <option value="qwen-max"></option>
                  <option value="glm-5.1"></option>
                  <option value="gpt-4.1"></option>
                  <option value="claude-3-5-sonnet-latest"></option>
                </datalist>
              </label>
              <label>
                <span>Base URL</span>
                <input
                  id="llm-base-url"
                  value="https://dashscope.aliyuncs.com/compatible-mode/v1"
                  placeholder="https://..."
                />
              </label>
              <label>
                <span>API Key</span>
                <input id="llm-api-key" type="password" autocomplete="off" placeholder="sk-..." />
              </label>
            </div>
            <div class="session-chip">仅本次会话</div>
          </section>
        </aside>

        <section class="main-stage">
          <section class="status-strip" aria-label="任务状态">
            <div>
              <span>模式</span>
              <strong id="job-mode">待命</strong>
            </div>
            <div>
              <span>状态</span>
              <strong id="job-status">IDLE</strong>
            </div>
            <div>
              <span>Job ID</span>
              <strong id="job-id">---</strong>
            </div>
            <div>
              <span>事件</span>
              <strong id="job-events">0</strong>
            </div>
          </section>

          <section class="panel workflow-panel">
            <div class="panel-title row-title">
              <div>
                <p>Realtime Workflow</p>
                <h2>Pipeline步骤输出</h2>
              </div>
              <span id="workflow-count" class="mini-badge">0 / 0</span>
            </div>
            <div id="workflow-list" class="workflow-list"></div>
          </section>

          <section class="stage-grid">
            <div class="panel result-panel-wrap">
              <div class="panel-title">
                <p>Decision</p>
                <h2>最终结论</h2>
              </div>
              <div id="result-panel" class="result-panel">
                <div class="empty-state">任务完成后显示侵权分析或可授权分析结论。</div>
              </div>
            </div>

            <div class="panel log-panel">
              <div class="panel-title">
                <p>Events</p>
                <h2>实时日志</h2>
              </div>
              <div id="event-log" class="event-log code-font">
                <div class="empty-state">&gt; awaiting workflow...</div>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
